name: Release

# Builds Notcher.dmg and attaches it to a GitHub release.
#
# Three ways to publish:
#   - push a tag: git tag v0.2.0 && git push origin v0.2.0
#   - push a commit whose message contains [release]: publishes v<VERSION file>
#   - run it from the Actions tab with a tag
# A tag that doesn't exist yet is created on the commit being built, and
# publishing an existing tag again replaces its DMG.
#
# Signing and notarization use these repository secrets when they're set
# (Settings → Secrets and variables → Actions):
#   MACOS_CERTIFICATE           your "Developer ID Application" certificate as a
#                               base64-encoded .p12
#   MACOS_CERTIFICATE_PASSWORD  the password you gave the .p12 when exporting it
#   NOTARY_APPLE_ID             your Apple ID email
#   NOTARY_TEAM_ID              your 10-character Apple Developer team ID
#   NOTARY_PASSWORD             an app-specific password for that Apple ID
# Without them the DMG is still built and published, but unsigned.

on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish, e.g. v0.2.0 (created if it doesn't exist)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build, sign and publish Notcher.dmg
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the tag, if it already exists
        run: |
          if [ -z "$TAG" ]; then
            TAG="v$(tr -d '[:space:]' < VERSION)"
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          fi
          echo "Publishing $TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
            echo "Building existing tag $TAG ($(git rev-parse --short HEAD))"
          else
            echo "Tag $TAG doesn't exist yet; building $(git rev-parse --short HEAD) and creating it on publish"
          fi
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version

      - name: Import the Developer ID certificate
        id: cert
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::No MACOS_CERTIFICATE secret, so this DMG is unsigned. See the comment at the top of release.yml."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/notcher.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERTIFICATE doesn't contain a 'Developer ID Application' certificate with its private key. These were found:"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build Notcher.app (Apple silicon and Intel)
        env:
          NOTCHER_UNIVERSAL: "1"
          NOTCHER_SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          export NOTCHER_VERSION="${TAG#v}"
          ./Scripts/build-app.sh
          lipo -info build/Notcher.app/Contents/MacOS/Notcher

      - name: Make the DMG (notarized when credentials are set)
        env:
          NOTCHER_SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./Scripts/make-dmg.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          STATUS="$(cat build/dmg-status)"
          {
            echo "## Notcher $VERSION"
            echo
            echo "**Download Notcher.dmg below**, open it and drag Notcher into Applications. It runs on macOS 14 Sonoma or later, on Apple silicon and Intel Macs."
            echo
            case "$STATUS" in
              notarized)
                echo "This build is signed with a Developer ID and notarized by Apple, so it opens like any other app." ;;
              signed)
                echo "This build is signed with a Developer ID but not notarized yet. The first time you open it, macOS may ask you to confirm in **System Settings → Privacy & Security → Open Anyway**." ;;
              *)
                echo "This build isn't signed with a Developer ID yet. The first time you open it, macOS will block it: go to **System Settings → Privacy & Security** and click **Open Anyway** next to Notcher. (Or run \`xattr -dr com.apple.quarantine /Applications/Notcher.app\` in Terminal.)" ;;
            esac
            echo
            if [ -f "docs/releases/$VERSION.md" ]; then
              cat "docs/releases/$VERSION.md"
              echo
            fi
            echo "Notcher doesn't include any commercial games. Only play ROMs of games you own."
          } > build/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Notcher.dmg --clobber
            gh release edit "$TAG" --title "Notcher $VERSION" --notes-file build/release-notes.md
          else
            gh release create "$TAG" build/Notcher.dmg --target "$TARGET_SHA" \
              --title "Notcher $VERSION" --notes-file build/release-notes.md --latest
          fi
          echo "Published $TAG ($STATUS): https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/notcher.keychain-db" 2>/dev/null || true
