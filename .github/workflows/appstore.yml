name: App Store

# Builds the Mac App Store version of Notcher.
#
# Every run checks that the sandboxed app starts and works, and renders the
# App Store screenshots (download them from the run's "Notcher-AppStore-
# screenshots" artifact). Once the secrets below are set, it also signs the
# app, packages it as Notcher.pkg and uploads it to App Store Connect, where
# it shows up under TestFlight. AppStore/README.md walks through getting each one.
#
# Run it from the Actions tab (App Store → Run workflow), or push a commit
# whose message contains [appstore].
#
# Secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_CERTIFICATES           a base64-encoded .p12 holding both your "Apple
#                                   Distribution" and "3rd Party Mac Developer
#                                   Installer" certificates with their private keys
#   APPSTORE_CERTIFICATES_PASSWORD  the password you gave that .p12
#   APPSTORE_PROFILE                your Mac App Store provisioning profile, base64-encoded
#   APPSTORE_API_KEY_ID             an App Store Connect API key's ID
#   APPSTORE_API_ISSUER_ID          the issuer ID shown above your API keys
#   APPSTORE_API_KEY                the contents of that key's AuthKey_<ID>.p8 file

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect (when the signing secrets are set)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appstore:
    name: Build for the Mac App Store
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[appstore]')
    # App Store Connect only takes apps built with Xcode 26 or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|release_candidate|_rc' | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Build the sandboxed app
        run: |
          NOTCHER_SANDBOX=1 NOTCHER_UNIVERSAL=1 ./Scripts/build-app.sh
          lipo -info build/Notcher.app/Contents/MacOS/Notcher
          codesign -d --entitlements - --xml build/Notcher.app 2>/dev/null | plutil -p -
          echo "Linked libraries:"
          otool -L build/Notcher.app/Contents/MacOS/Notcher
          # Everything has to come from the OS: the app bundle carries no
          # libraries of its own.
          if otool -L build/Notcher.app/Contents/MacOS/Notcher | grep -q '@rpath'; then
            echo "::error::The app links a library that isn't part of macOS (see @rpath above). It would fail to start on older Macs."
            exit 1
          fi

      - name: Run the sandboxed app
        run: |
          CONTAINER="$HOME/Library/Containers/app.notcher.Notcher/Data"
          open build/Notcher.app
          for _ in $(seq 1 20); do
            pgrep -x Notcher >/dev/null && break
            sleep 0.5
          done
          sleep 8
          if ! pgrep -x Notcher >/dev/null; then
            echo "::error::Notcher quit or crashed within 8 seconds of starting in the sandbox."
            ls -t "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -3 | while read -r f; do
              head -80 "$HOME/Library/Logs/DiagnosticReports/$f"
            done
            exit 1
          fi
          echo "Running in the sandbox: $(pgrep -x Notcher)"
          [ -d "$CONTAINER" ] || { echo "::error::No sandbox container at $CONTAINER"; exit 1; }
          ls -la "$CONTAINER/Library/Application Support/Notcher" || true
          pkill -TERM -x Notcher
          for _ in $(seq 1 20); do
            pgrep -x Notcher >/dev/null || break
            sleep 0.5
          done
          if pgrep -x Notcher >/dev/null; then
            echo "::error::Notcher didn't quit when asked."
            pkill -KILL -x Notcher
            exit 1
          fi
          echo "Quit cleanly."

      - name: Render previews and App Store screenshots inside the sandbox
        run: |
          CONTAINER="$HOME/Library/Containers/app.notcher.Notcher/Data"
          build/Notcher.app/Contents/MacOS/Notcher --render-previews "$CONTAINER/previews"
          build/Notcher.app/Contents/MacOS/Notcher --render-appstore "$CONTAINER/appstore"
          COUNT="$(ls "$CONTAINER/previews" | grep -c '\.png$' || true)"
          echo "Rendered $COUNT previews"
          [ "$COUNT" -ge 40 ] || { echo "::error::Expected at least 40 previews"; exit 1; }
          mkdir -p build/appstore-screenshots
          cp "$CONTAINER"/appstore/*.jpg build/appstore-screenshots/
          for f in build/appstore-screenshots/*.jpg; do
            echo "$(basename "$f"): $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}')"
          done
          [ "$(ls build/appstore-screenshots | wc -l)" -eq 5 ] || { echo "::error::Expected 5 screenshots"; exit 1; }

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Notcher-AppStore-screenshots
          path: build/appstore-screenshots
          if-no-files-found: error

      - name: Print the screenshots
        # Base64 in the log, so they can be checked without artifact access.
        if: contains(github.event.head_commit.message, '[appstore-shots]')
        run: |
          for f in build/appstore-screenshots/*.jpg; do
            name="$(basename "$f" .jpg)"
            echo "=====BEGIN $name"
            base64 -b 16000 -i "$f"
            echo "=====END $name"
          done

      - name: Check for signing secrets
        id: secrets
        env:
          APPSTORE_CERTIFICATES: ${{ secrets.APPSTORE_CERTIFICATES }}
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          if [ -z "$APPSTORE_CERTIFICATES" ] || [ -z "$APPSTORE_PROFILE" ]; then
            echo "::notice::The sandboxed app works. To sign it and upload it to App Store Connect, add the APPSTORE_* secrets (see AppStore/README.md)."
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$APPSTORE_API_KEY" ] && [ "${{ github.event_name != 'workflow_dispatch' || inputs.upload }}" = "true" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the App Store certificates
        if: steps.secrets.outputs.sign == 'true'
        env:
          APPSTORE_CERTIFICATES: ${{ secrets.APPSTORE_CERTIFICATES }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/appstore.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPSTORE_CERTIFICATES" | base64 --decode > "$RUNNER_TEMP/appstore.p12"
          security import "$RUNNER_TEMP/appstore.p12" -k "$KEYCHAIN" -P "$APPSTORE_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$RUNNER_TEMP/appstore.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "Identities in the .p12:"
          security find-identity -v "$KEYCHAIN"

          printf '%s' "$APPSTORE_PROFILE" | base64 --decode > "$RUNNER_TEMP/Notcher.provisionprofile"
          echo "APPSTORE_PROFILE_PATH=$RUNNER_TEMP/Notcher.provisionprofile" >> "$GITHUB_ENV"

          if [ -n "$APPSTORE_API_KEY" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            printf '%s\n' "$APPSTORE_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          fi

      - name: Sign and package Notcher.pkg
        if: steps.secrets.outputs.sign == 'true'
        run: APPSTORE_PROFILE="$APPSTORE_PROFILE_PATH" ./Scripts/build-appstore.sh

      - name: Upload Notcher.pkg as an artifact
        if: steps.secrets.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Notcher-AppStore-pkg
          path: build/Notcher.pkg
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: steps.secrets.outputs.sign == 'true' && steps.secrets.outputs.upload == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          AUTH=(--apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID")
          xcrun altool --validate-app -f build/Notcher.pkg -t macos "${AUTH[@]}"
          xcrun altool --upload-app -f build/Notcher.pkg -t macos "${AUTH[@]}"
          echo "::notice::Uploaded. The build appears in App Store Connect → TestFlight once Apple has processed it (usually under 30 minutes)."

      - name: Clean up keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/appstore.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/Notcher.provisionprofile"
