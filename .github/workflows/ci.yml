name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test NotcherCore
        run: swift test

  app-macos:
    name: Build app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version
      - name: Test
        run: swift test
      - name: Build Notcher.app
        run: ./Scripts/build-app.sh --zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Notcher-app
          path: build/Notcher.zip
          if-no-files-found: error
      - name: Render previews
        run: |
          build/Notcher.app/Contents/MacOS/Notcher --render-previews build/previews
          ls -la build/previews
      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: Notcher-previews
          path: build/previews
      - name: Print previews
        # Small JPEGs in the log so the previews can be inspected without artifact access.
        run: |
          mkdir -p /tmp/previews
          for f in build/previews/*.png; do
            name="$(basename "$f" .png)"
            sips -Z 1000 -s format jpeg -s formatOptions 72 "$f" --out "/tmp/previews/$name.jpg" >/dev/null
            echo "=====BEGIN $name"
            base64 -b 76 -i "/tmp/previews/$name.jpg"
            echo "=====END $name"
          done
